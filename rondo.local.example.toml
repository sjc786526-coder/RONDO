# Copy this file to the ignored repository-root `rondo.local.toml` and fill only
# machine-specific values. The committed example is the stable loader contract.

[paid_eval]
# Switch these three aliases in the ignored local copy; do not commit the real
# provider domain, model identifiers, or prices.
active_provider = "relay"
main_model = "sol"
guardian_model = "luna"
main_reasoning_effort = "medium"
guardian_reasoning_effort = "low"
# Total upstream attempts, including the first one. Only the explicitly listed
# complete non-2xx responses below are eligible for an unbilled retry.
max_attempts = 5
retry_backoff_seconds = 1.0

[paid_eval.providers.relay]
display_name = "Example Responses relay"
api = "responses"
base_url = "https://relay.example.com/v1"
api_key_env = "OPENAI_API_KEY"
unbilled_retry_statuses = [429, 500, 502, 503, 504]

[paid_eval.providers.official]
display_name = "Example official endpoint"
api = "responses"
base_url = "https://official.example.com/v1"
api_key_env = "OPENAI_OFFICIAL_API_KEY"
unbilled_retry_statuses = [429, 500, 502, 503, 504]

# Prices are decimal strings in USD per million tokens. Replace every example
# model id and rate from the official price source on the snapshot date.
[paid_eval.models.sol]
model_id = "example-sol-model"
input_usd_per_million = "1.00"
cached_input_usd_per_million = "0.10"
output_usd_per_million = "6.00"
long_context_threshold_tokens = 272000
long_context_input_multiplier = "2"
long_context_output_multiplier = "1.5"
cache_write_input_multiplier = "1.25"
price_snapshot_date = "2026-08-10"
price_source_url = "https://developers.openai.com/api/docs/models/compare"

[paid_eval.models.terra]
model_id = "example-terra-model"
input_usd_per_million = "1.00"
cached_input_usd_per_million = "0.10"
output_usd_per_million = "6.00"
long_context_threshold_tokens = 272000
long_context_input_multiplier = "2"
long_context_output_multiplier = "1.5"
cache_write_input_multiplier = "1.25"
price_snapshot_date = "2026-08-10"
price_source_url = "https://developers.openai.com/api/docs/models/compare"

[paid_eval.models.luna]
model_id = "example-luna-model"
input_usd_per_million = "1.00"
cached_input_usd_per_million = "0.10"
output_usd_per_million = "6.00"
long_context_threshold_tokens = 272000
long_context_input_multiplier = "2"
long_context_output_multiplier = "1.5"
cache_write_input_multiplier = "1.25"
price_snapshot_date = "2026-08-10"
price_source_url = "https://developers.openai.com/api/docs/models/compare"

[providers.deepseek]
api = "chat_completions"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-v4-flash"

[providers.qwen]
api = "chat_completions"
# DashScope keys and endpoints are region-bound; this default targets Beijing.
region = "cn-beijing"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
model = "qwen3.6-flash"

[local_model]
runtime = "llama_cpp"
api = "responses"
base_url = "http://127.0.0.1:8080/v1"
api_key_env = "RONDO_LOCAL_MODEL_API_KEY"
model_id = "rondo-local-approval"
# Set both fields only after a reviewed local GGUF is installed. Until then the
# doctor accurately reports model_missing without downloading or loading one.
model_path = ""
model_sha256 = ""
format = "gguf"
quantization = "Q4_K_M"

[local_model.server]
# Install the source-built runtime frozen by
# eval/locks/llama-cpp-b10333-cuda-linux-x64.json below this ignored
# project-local path. Global/PATH binaries are rejected; the CPU lock remains
# available for its separate exact path.
binary = "eval-data/tools/llama-b10333-cuda-linux-x64/llama-server"
host = "127.0.0.1"
port = 8080
# The qualified 12k serving contract. These eight values are the ones the
# model-backed qualification evidence binds, so changing any of them makes the
# live capability fall back to linux_cuda_built_model_unvalidated until the
# contract is qualified again. `--fit on` only adjusts arguments left at their
# default, and b10333 rewrites the context size only when it is 0, so the
# explicit 12288 below is never reduced to make the model fit.
context_size = 12288
gpu_layers = "auto"
fit = "on"
batch_size = 512
ubatch_size = 256
cache_type_k = "f16"
cache_type_v = "f16"
no_mmproj = true
chat_template_file = "eval/templates/local-approval/ministral-3-8b-instruct-2512-chat-template.jinja"
chat_template_sha256 = "74eeb55fd3341286ec3fd44e902b7120721acc81cd394e96b431f85e93a1ea56"
jinja = true
flash_attention = "on"
parallel = 1
metrics = true
slots = true
web_ui = false
tools = false

[local_model.request]
stream = false
temperature = 0.0
top_p = 1.0
seed = 42
max_output_tokens = 512
timeout_seconds = 120
max_retries = 0
structured_output = true
