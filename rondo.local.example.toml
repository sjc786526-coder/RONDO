# Copy this file to the ignored repository-root `rondo.local.toml` and fill only
# machine-specific values. The committed example is the stable loader contract.

[providers.openai]
api = "responses"
# Any credential-free HTTPS OpenAI-compatible base URL may be used here.
base_url = "https://api.example.com/v1"
api_key_env = "OPENAI_API_KEY"
main_model = "gpt-5.6-sol"
guardian_model = "gpt-5.6-luna"
guardian_reasoning_effort = "low"

[providers.deepseek]
api = "chat_completions"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-v4-flash"

[providers.qwen]
api = "chat_completions"
# DashScope keys and endpoints are region-bound; this default targets Beijing.
region = "cn-beijing"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
model = "qwen3.6-flash"

[local_model]
runtime = "llama_cpp"
api = "responses"
base_url = "http://127.0.0.1:8080/v1"
api_key_env = "RONDO_LOCAL_MODEL_API_KEY"
model_id = "rondo-local-approval"
# Set both fields only after a reviewed local GGUF is installed. Until then the
# doctor accurately reports model_missing without downloading or loading one.
model_path = ""
model_sha256 = ""
format = "gguf"
quantization = "Q4_K_M"

[local_model.server]
# Install the digest-pinned b10333 asset from eval/locks/llama-cpp-b10333.json
# below this ignored project-local path. Global/PATH binaries are rejected.
binary = "eval-data/tools/llama-b10333/llama-server"
host = "127.0.0.1"
port = 8080
# 0 means use the context size stored in the model. L2 acceptance will measure
# the largest safe context on the actual GPU instead of assuming one here.
context_size = 0
gpu_layers = "auto"
flash_attention = "auto"
parallel = 1
metrics = true
slots = true
web_ui = false
tools = false

[local_model.request]
stream = false
temperature = 0.0
top_p = 1.0
seed = 42
max_output_tokens = 512
timeout_seconds = 120
max_retries = 0
structured_output = true
