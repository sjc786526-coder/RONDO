[package]
name = "codex-publication-critic"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_publication_critic"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "codex-publication-critic-service"
path = "src/bin/codex-publication-critic-service.rs"

[[bin]]
name = "codex-publication-critic-real-service"
path = "src/bin/codex-publication-critic-real-service.rs"

[[bin]]
name = "codex-publication-critic-cloud-service"
path = "src/bin/codex-publication-critic-cloud-service.rs"

[[bin]]
name = "codex-publication-critic-probe"
path = "src/bin/codex-publication-critic-probe.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
codex-http-client = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true }

[dev-dependencies]
codex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
wiremock = { workspace = true }
