# RONDO 工作区级构建资源上限。
#
# 背景：2026-08-08 的全量测试触发 WSL2 全局 OOM。根因不是 CPU 不足，而是 cargo
# 默认按逻辑 CPU 数（本机 32）并行拉起 rustc / rust-lld，编译与链接阶段的内存
# 峰值超过 WSL 的 26 GB 内存 + 10 GB swap，内核 OOM Killer 杀掉了 systemd 与
# 用户会话进程，连带断开 VS Code Remote 和所有 agent 会话。
#
# 放在仓库根目录而不是 mydev/codex-rs/.cargo/config.toml 的原因：
#   1. cargo 从 cwd 逐级向上合并 .cargo/config.toml，因此本文件同时覆盖
#      mydev/codex-rs、mydev/tools、codex-source-code 以及 .claude/worktrees/
#      下的所有构建，不会因为换了 worktree 就失效；
#   2. 不改动上游 codex 自带的配置，避免基线升级时产生冲突。
#
# 优先级：命令行 `-j N` > 环境变量 CARGO_BUILD_JOBS > 本文件；项目安全规则禁止
# 普通开发使用前两者提高并发。确需调整时必须由用户单独授权并重新评估看门狗阈值。
#
# 2026-08-08 的 jobs=6 历史基准见 doc/development-environment.md §3.5。Plan 093
# 的 196 GB 共享 target 在较高 Cargo/LLD 并发下反复触发持续 PSI 停机，因此日常
# 默认收紧到 jobs=2，并把 GNU/Linux LLD 的内部线程固定为 1。必须尽量一次跑完的
# workspace 使用产品 Justfile 中受跟踪的 conservative 入口（jobs=1），不要临时
# 拼接 CARGO_BUILD_JOBS/RUSTFLAGS。
[build]
jobs = 2

# 机器级 rustc 总并发兜底。jobs 只管单次 cargo 调用内部的并发，两个 agent 各自直接
# 敲 cargo 仍可能叠加；with-build-lock.sh 负责保证经过 just 的重型 Cargo 构建互斥，
# 本闸门则把所有入口、worktree 和 agent 的 rustc 总数限制在同一组槽内。它不等同于
# “同一时刻只有一个 Cargo 构建”。脚本安全依赖不可用时会告警并 fail-closed。
# 相对路径由 cargo 解析成「`.cargo/` 的父目录」下的路径，因此在主工作区和各
# worktree 里都各自指向自己那一份，不写死绝对路径。脚本安全依赖不可用时
# fail-closed；显式关闭开关只用于用户单独授权的故障诊断。
rustc-wrapper = "./.cargo/rustc-throttle.sh"

# 当前正式 Linux 构建通过 linker driver 调用 LLD；限制单次链接内部并发，避免 Cargo
# jobs 已受控但一个 rust-lld 仍自行扩张。Windows 使用各产品已有的目标专属 flags。
[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
rustflags = ["-C", "link-arg=-Wl,--threads=1"]
