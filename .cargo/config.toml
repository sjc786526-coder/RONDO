# RONDO 工作区级构建资源上限。
#
# 背景：2026-08-08 的全量测试触发 WSL2 全局 OOM。根因不是 CPU 不足，而是 cargo
# 默认按逻辑 CPU 数（本机 32）并行拉起 rustc / rust-lld，编译与链接阶段的内存
# 峰值超过 WSL 的 27 GiB 内存 + 10 GiB swap，内核 OOM Killer 杀掉了 systemd 与
# 用户会话进程，连带断开 VS Code Remote 和所有 agent 会话。
#
# 放在仓库根目录而不是 mydev/codex-rs/.cargo/config.toml 的原因：
#   1. cargo 从 cwd 逐级向上合并 .cargo/config.toml，因此本文件同时覆盖
#      mydev/codex-rs、mydev/tools、codex-source-code 以及 .claude/worktrees/
#      下的所有构建，不会因为换了 worktree 就失效；
#   2. 不改动上游 codex 自带的配置，避免基线升级时产生冲突。
#
# 优先级：命令行 `-j N` > 环境变量 CARGO_BUILD_JOBS > 本文件。临时需要更高并发
# 时用前两者显式放开，不要直接改这里。
#
# 取值依据（2026-08-08 实测，见 doc/development-environment.md §3.5）：
# 全 workspace 测试二进制构建在 jobs=8 时峰值 18.7 GB，出现在 8 个槽同时链接的
# 瞬间；空载基线约 4.8 GB，即每个并发槽峰值约 1.74 GB：
#     峰值内存 ≈ 4.8 GB + 1.74 GB × jobs
# WSL 现分配 26 GB，按 25 GB 保守估算且不把 swap 算作可用区域，jobs=6 预计峰值
# 约 15 GB，给页缓存和其他 agent 会话留出余量。
[build]
jobs = 6

# 机器级 rustc 总并发兜底。jobs 只管单次 cargo 调用内部的并发，两个 agent 各自直接
# 敲 cargo 仍可能叠加；with-build-lock.sh 负责保证经过 just 的重型 Cargo 构建互斥，
# 本闸门则把所有入口、worktree 和 agent 的 rustc 总数限制在同一组槽内。它不等同于
# “同一时刻只有一个 Cargo 构建”。脚本降级时会告警并 fail-open，详见脚本头部注释。
# 相对路径由 cargo 解析成「`.cargo/` 的父目录」下的路径，因此在主工作区和各
# worktree 里都各自指向自己那一份，不写死绝对路径。
rustc-wrapper = "./.cargo/rustc-throttle.sh"
