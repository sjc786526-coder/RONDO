[project]
name = "rondo-publication-critic-plan054-env"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psutil==7.0.0",
    "safetensors==0.5.3",
    "torch==2.7.1",
    "transformers==4.52.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
