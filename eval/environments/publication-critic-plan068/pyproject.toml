[project]
name = "rondo-publication-critic-plan068-env"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.43.78",
    "huggingface-hub==0.36.2",
    "psutil==7.0.0",
    "safetensors==0.5.3",
    "tokenizers==0.21.4",
    "torch==2.8.0",
    "transformers==4.52.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
