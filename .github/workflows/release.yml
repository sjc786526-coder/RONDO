name: release

# Tag-triggered release for the two RONDO product lines.
#
#   local-vX.Y.Z[-rcN]  ->  builds and publishes mydev/    (RONDO Local)
#   multi-vX.Y.Z[-rcN]  ->  builds and publishes multidev/ (RONDO Multi)
#
# The two tracks never mix: a `local-*` tag must not build multidev, and vice
# versa (plan 103, H8).
#
# The product version lives ONLY in the tag. The Cargo workspace version stays
# pinned at the frozen upstream baseline 0.147.0 because
# `eval/rondo_eval/binary_freeze.py` hard-asserts it for byte-level fair
# comparison against upstream Codex (plan 103, H1/KD-001). `--version` therefore
# reports 0.147.0; that is intentional and is documented in the release notes.

on:
  push:
    tags:
      - "local-v*"
      - "multi-v*"

# Read-only by default. Only the `publish` job escalates to contents: write.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The `on.push.tags` globs above are deliberately loose (globs cannot express
  # SemVer). This job is the real gate: anything that is not a well-formed RONDO
  # release tag fails here rather than being silently published as a release.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    outputs:
      product: ${{ steps.parse.outputs.product }}
      product_dir: ${{ steps.parse.outputs.product_dir }}
      variant: ${{ steps.parse.outputs.variant }}
      version: ${{ steps.parse.outputs.version }}
      base_version: ${{ steps.parse.outputs.base_version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse and validate the release tag
        id: parse
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # SemVer core segments use (0|[1-9][0-9]*), not [0-9]+, so leading
          # zeros like local-v01.2.3 are rejected. RC numbers start at 1.
          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'

          if [[ "$TAG" =~ ^(local|multi)-v${core}$ ]]; then
            prerelease=false
          elif [[ "$TAG" =~ ^(local|multi)-v${core}-rc[1-9][0-9]*$ ]]; then
            prerelease=true
          else
            echo "::error::Tag '$TAG' is not a valid RONDO release tag."
            echo "::error::Expected (local|multi)-vX.Y.Z or (local|multi)-vX.Y.Z-rcN."
            exit 1
          fi

          product="${BASH_REMATCH[1]}"
          version="${TAG#"${product}"-v}"
          base_version="${version%-rc*}"

          case "$product" in
            local) product_dir=mydev;    variant=rondo ;;
            multi) product_dir=multidev; variant=rondo-multi ;;
          esac

          {
            echo "product=$product"
            echo "product_dir=$product_dir"
            echo "variant=$variant"
            echo "version=$version"
            echo "base_version=$base_version"
            echo "prerelease=$prerelease"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build one complete product package.
  #
  # Single-entry matrix on purpose. The first release ships only
  # x86_64-unknown-linux-musl -- shipping a platform we cannot verify ourselves
  # is worse than not shipping it (plan 103, KD-009). Adding a target later is a
  # one-line matrix change, not a restructure.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ needs.validate.outputs.variant }} (${{ matrix.target }})
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl]
    env:
      TARGET: ${{ matrix.target }}
      PRODUCT_DIR: ${{ needs.validate.outputs.product_dir }}
      VARIANT: ${{ needs.validate.outputs.variant }}
      VERSION: ${{ needs.validate.outputs.version }}
      # A release build of this workspace emits ~2700 object files, and the
      # first rc run died with "No space left on device" while linking the
      # entrypoint. Debug info is the bulk of that. We publish no symbols
      # archive, so line tables would only ever have been read by us; drop them
      # rather than pay for them twice in disk and link time.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The runner image ships toolchains this build never touches, and the
      # root filesystem is the constraint. Only well-known preinstalled paths
      # are removed, on a disposable VM.
      - name: Free up runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "before:"; df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          echo "after:"; df -h /

      - name: Print runner specs
        shell: bash
        run: |
          set -euo pipefail
          echo "CPUs: $(nproc)"
          free -h
          df -h .

      # bwrap links libcap; the packaging step needs binutils for strip.
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils pkg-config libcap-dev

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Use hermetic Cargo home (musl)
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      # Installed here, BEFORE the musl toolchain setup, on purpose: that script
      # exports zig cc/c++ shims as the global CC/CXX, and cargo-about has
      # native dependencies of its own that must be built for the host.
      # Built from source rather than fetched: cargo-about is not in
      # taiki-e/install-action's managed tool list, so that action would fall
      # back to cargo-binstall, adding a failure mode for no benefit.
      - name: Install cargo-about
        shell: bash
        run: |
          set -euo pipefail
          # --features cli is required, not optional: cargo-about declares
          #   [[bin]] required-features = ["cli"]
          # and has no default feature, so a plain `cargo install` builds the
          # library, installs no binary, and still exits 0 with only a warning.
          cargo install cargo-about --locked --version 0.9.2 --features cli
          # Never trust the exit code alone for that reason.
          command -v cargo-about
          cargo about --version

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      # Reuses the upstream script that already lives in the product tree. It
      # builds libcap for the musl target, installs the zig cc/c++ shims and
      # exports the whole CC/CXX/PKG_CONFIG environment to $GITHUB_ENV.
      # Cross-compiling to musl is not "just add --target"; do not reimplement.
      - name: Install musl build tools
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/${PRODUCT_DIR}/.github/scripts/install-musl-build-tools.sh"

      - name: Disable aws-lc jitter entropy (musl)
        shell: bash
        run: |
          set -euo pipefail
          # aws-lc's jitter entropy path misbehaves on musl builders.
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      # --- STEP 1 of the frozen build order ---------------------------------
      # V8 artifacts are named with the full target triple. The product's
      # with_codex_v8_artifacts.py wrapper selects by `rustc -vV` HOST, which on
      # this runner is x86_64-unknown-linux-gnu -- using it would link the GNU
      # V8 into a musl target. Select by $TARGET instead. The wrapper is not
      # modified; this only imports the same modules it does.
      #
      # Both variables MUST land in $GITHUB_ENV: every step is a separate shell,
      # so printing them to the log would not reach the later cargo steps.
      - name: Fetch and verify rusty_v8 artifacts for $TARGET
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TARGET" "$PRODUCT_DIR" >> "$GITHUB_ENV" <<'PY'
          import sys
          target, product_dir = sys.argv[1], sys.argv[2]
          sys.path.insert(0, f"{product_dir}/scripts")
          from codex_package.targets import TARGET_SPECS
          from codex_package.v8 import fetch_codex_v8_artifacts, resolved_v8_crate_version

          spec = TARGET_SPECS[target]
          artifacts = fetch_codex_v8_artifacts(spec, version=resolved_v8_crate_version())
          print(f"RUSTY_V8_ARCHIVE={artifacts.archive}")
          print(f"RUSTY_V8_SRC_BINDING_PATH={artifacts.binding}")
          PY
          echo "Resolved V8 artifacts for ${TARGET}:"
          grep -E '^RUSTY_V8_' "$GITHUB_ENV"

      # --- STEP 2 of the frozen build order ---------------------------------
      # SECURITY CONTROL, not ordering pedantry.
      #
      # `linux-sandbox/src/bundled_bwrap.rs` reads CODEX_BWRAP_SHA256 through
      # option_env!(), i.e. at COMPILE TIME. If it is absent, expected_sha256()
      # returns None and verify_digest() returns Ok(()) -- the bundled bwrap
      # integrity check is silently skipped, and every ordinary smoke test still
      # passes. So bwrap must be built, stripped and hashed BEFORE the codex
      # binary is compiled. The digest covers the stripped bytes because those
      # are the bytes that get packaged.
      - name: Build bwrap, strip it, and export its digest
        shell: bash
        working-directory: ${{ needs.validate.outputs.product_dir }}/codex-rs
        run: |
          set -euo pipefail
          cargo build --locked --target "$TARGET" --release --bin bwrap

          bwrap_path="target/${TARGET}/release/bwrap"
          test -f "$bwrap_path" || { echo "missing ${bwrap_path}" >&2; exit 1; }

          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "bwrap sha256:${digest}"

      # --- STEP 3 of the frozen build order ---------------------------------
      # Only now is the digest compiled into the entrypoint.
      # --target and --profile are pinned explicitly: --entrypoint-bin only
      # checks that the file exists and is executable, it does NOT validate the
      # architecture, so a stray host/debug build would be packaged as a "musl
      # release" without complaint.
      - name: Build entrypoint and code-mode host
        shell: bash
        working-directory: ${{ needs.validate.outputs.product_dir }}/codex-rs
        run: |
          set -euo pipefail
          df -h / | tail -1
          cargo build --locked --target "$TARGET" --release \
            --bin codex --bin codex-code-mode-host
          echo "disk after linking:"; df -h / | tail -1
          du -sh "target/${TARGET}/release" || true

      - name: Verify the built artifacts are actually musl
        shell: bash
        working-directory: ${{ needs.validate.outputs.product_dir }}/codex-rs
        run: |
          set -euo pipefail
          out="target/${TARGET}/release"
          for binary in codex codex-code-mode-host bwrap; do
            test -f "${out}/${binary}" || { echo "missing ${out}/${binary}" >&2; exit 1; }
            file "${out}/${binary}"
            # A statically linked musl build must not carry an ELF interpreter.
            if readelf -l "${out}/${binary}" | grep -q "Requesting program interpreter"; then
              echo "::error::${binary} is dynamically linked; expected a static musl build."
              exit 1
            fi
          done

      # --- STEP 4 of the frozen build order ---------------------------------
      # All three prebuilt artifacts are handed in explicitly so the packager's
      # `binaries` list is empty and its internal cargo build is skipped
      # entirely. That internal build does NOT pass --locked and would also
      # rebuild bwrap after the digest was already compiled in.
      #
      # --archive-output is deliberately NOT passed: the packager writes the
      # archive immediately after validating the package dir, so license
      # material injected afterwards would never reach it. Archive by hand.
      - name: Build the product package directory
        shell: bash
        run: |
          set -euo pipefail
          out="${PRODUCT_DIR}/codex-rs/target/${TARGET}/release"
          stage="${RUNNER_TEMP}/stage"
          pkgname="${VARIANT}-${VERSION}-${TARGET}"
          mkdir -p "$stage"

          python3 "${PRODUCT_DIR}/scripts/build_codex_package.py" \
            --target "$TARGET" \
            --variant "$VARIANT" \
            --cargo-profile release \
            --entrypoint-bin "${out}/codex" \
            --code-mode-host-bin "${out}/codex-code-mode-host" \
            --bwrap-bin "${out}/bwrap" \
            --package-dir "${stage}/${pkgname}"

          echo "STAGE=${stage}" >> "$GITHUB_ENV"
          echo "PKGNAME=${pkgname}" >> "$GITHUB_ENV"
          echo "PKGDIR=${stage}/${pkgname}" >> "$GITHUB_ENV"
          find "${stage}/${pkgname}" -type f | sort

      # --- STEP 5: license material, BEFORE archiving ------------------------
      - name: Inject license material into the package
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE "${PKGDIR}/LICENSE"
          cp "${PRODUCT_DIR}/NOTICE" "${PKGDIR}/NOTICE"
          bash .github/scripts/collect-third-party-licenses.sh \
            --product-dir "$PRODUCT_DIR" \
            --target "$TARGET" \
            --entrypoint "$VARIANT" \
            --out "${PKGDIR}/THIRD-PARTY-LICENSES"

      # --- STEP 6: archive, then unpack and re-verify ------------------------
      - name: Archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          dist="${GITHUB_WORKSPACE}/dist"
          mkdir -p "$dist"
          tar -C "$STAGE" -czf "${dist}/${PKGNAME}.tar.gz" "$PKGNAME"
          ( cd "$dist" && sha256sum "${PKGNAME}.tar.gz" > SHA256SUMS )
          cat "${dist}/SHA256SUMS"

      # "The command did not error" is not evidence. Unpack what was actually
      # archived and compare it against the prebuilt inputs byte for byte.
      - name: Unpack the archive and re-verify its contents
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/${PRODUCT_DIR}/codex-rs/target/${TARGET}/release"
          check="${RUNNER_TEMP}/unpack"
          mkdir -p "$check"
          tar -C "$check" -xzf "${GITHUB_WORKSPACE}/dist/${PKGNAME}.tar.gz"
          root="${check}/${PKGNAME}"

          same() {
            local a b
            a="$(sha256sum "$1" | awk '{print $1}')"
            b="$(sha256sum "$2" | awk '{print $1}')"
            if [[ "$a" != "$b" ]]; then
              echo "::error::$1 does not match $2 ($a != $b)"
              exit 1
            fi
            echo "ok  $1  sha256:$a"
          }

          same "${root}/bin/${VARIANT}"              "${out}/codex"
          same "${root}/bin/codex-code-mode-host"    "${out}/codex-code-mode-host"
          same "${root}/codex-resources/bwrap"       "${out}/bwrap"

          # The packaged bwrap must be exactly the bytes whose digest was
          # compiled into the entrypoint.
          packaged="$(sha256sum "${root}/codex-resources/bwrap" | awk '{print $1}')"
          if [[ "$packaged" != "$CODEX_BWRAP_SHA256" ]]; then
            echo "::error::packaged bwrap digest ${packaged} != compiled-in ${CODEX_BWRAP_SHA256}"
            exit 1
          fi
          echo "ok  packaged bwrap matches the compiled-in digest"

          for required in \
            LICENSE \
            NOTICE \
            codex-package.json \
            codex-path/rg \
            codex-resources/zsh/bin/zsh \
            THIRD-PARTY-LICENSES/README.md \
            THIRD-PARTY-LICENSES/v8-icu-NOTICE.md \
            THIRD-PARTY-LICENSES/bubblewrap-0.11.2-COPYING \
            "THIRD-PARTY-LICENSES/rust-dependencies-${VARIANT}.md" \
            THIRD-PARTY-LICENSES/rust-dependencies-codex-code-mode-host.md \
            THIRD-PARTY-LICENSES/rust-dependencies-bwrap.md \
            THIRD-PARTY-LICENSES/v8-ac1e23989121-LICENSE \
            THIRD-PARTY-LICENSES/v8-ac1e23989121-LICENSE.fdlibm \
            THIRD-PARTY-LICENSES/v8-ac1e23989121-LICENSE.strongtalk \
            THIRD-PARTY-LICENSES/v8-ac1e23989121-LICENSE.v8 \
            THIRD-PARTY-LICENSES/rusty_v8-150.4.0-LICENSE \
            THIRD-PARTY-LICENSES/icu4c-LICENSE
          do
            test -s "${root}/${required}" || { echo "::error::archive is missing or has an empty ${required}"; exit 1; }
            echo "ok  ${required}"
          done

          # Presence is not enough for a notice file: the obligation is to
          # reproduce the *text*. Assert a distinctive phrase from each grant so
          # a stub, a symlink target or an HTML error page cannot pass.
          assert_contains() {
            grep -qF "$2" "${root}/THIRD-PARTY-LICENSES/$1" \
              || { echo "::error::${1} does not contain the expected license text ($2)"; exit 1; }
            echo "ok  ${1} carries its license text"
          }
          assert_contains v8-ac1e23989121-LICENSE.v8 \
            "Redistributions in binary form must reproduce the above"
          assert_contains rusty_v8-150.4.0-LICENSE "MIT License"
          assert_contains icu4c-LICENSE "UNICODE LICENSE"
          # bubblewrap ships the *Library* GPL v2 text (SPDX LGPL-2.0-or-later),
          # which is titled "LIBRARY", not "LESSER".
          assert_contains bubblewrap-0.11.2-COPYING "GNU LIBRARY GENERAL PUBLIC LICENSE"

      - name: Upload release artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rondo-package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Clean-environment verification.
  #
  # A separate job means a fresh, disposable runner that has never built or
  # installed RONDO -- the "clean machine" requirement, without needing Docker.
  # Running BEFORE publish means a broken package is never published.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify package on a clean runner
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET: x86_64-unknown-linux-musl
      VARIANT: ${{ needs.validate.outputs.variant }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rondo-package-x86_64-unknown-linux-musl
          path: dist

      - name: Verify checksums and unpack
        shell: bash
        run: |
          set -euo pipefail
          ( cd dist && sha256sum -c SHA256SUMS )
          mkdir -p unpacked
          tar -C unpacked -xzf "dist/${VARIANT}-${VERSION}-${TARGET}.tar.gz"
          echo "PKG=${GITHUB_WORKSPACE}/unpacked/${VARIANT}-${VERSION}-${TARGET}" >> "$GITHUB_ENV"

      # The bundled bwrap is only used when no usable system bwrap exists on
      # PATH (see linux-sandbox/src/launcher.rs). If one were present, the
      # checks below would exercise the wrong code path and pass without
      # proving anything. Fail loudly instead of quietly testing nothing.
      - name: Assert no system bwrap shadows the bundled one
        shell: bash
        run: |
          set -euo pipefail
          if command -v bwrap >/dev/null 2>&1; then
            echo "::error::A system bwrap is on PATH ($(command -v bwrap))."
            echo "::error::The bundled-bwrap checks below would not be exercised."
            exit 1
          fi
          echo "ok  no system bwrap on PATH"

      - name: Smoke test - version
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_HOME="${RUNNER_TEMP}/codex-home"
          mkdir -p "$CODEX_HOME"
          "${PKG}/bin/${VARIANT}" --version
          # The workspace version is frozen at the upstream baseline on purpose
          # (H1); the product version lives in the tag.
          "${PKG}/bin/${VARIANT}" --version | grep -q '0\.147\.0'

      # Exercises a bundled companion component through the product rather than
      # by running it directly: doctor's `search` check resolves ripgrep from
      # the package layout, which also proves that renaming the entrypoint did
      # not break package-layout detection.
      - name: Smoke test - bundled companion components
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_HOME="${RUNNER_TEMP}/codex-home"
          mkdir -p "$CODEX_HOME"
          set +e
          out="$("${PKG}/bin/${VARIANT}" doctor 2>&1)"
          set -e
          echo "$out"
          # doctor legitimately exits non-zero when not logged in, so assert on
          # the specific line rather than on the exit code.
          echo "$out" | grep -E 'search.*bundled' \
            || { echo "::error::doctor did not resolve the bundled ripgrep"; exit 1; }

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # and bubblewrap needs CLONE_NEWUSER. Without this the bundled sandbox
      # cannot start at all, so the checks below would be testing the
      # restriction rather than the package.
      - name: Allow unprivileged user namespaces (Ubuntu 24.04)
        shell: bash
        run: |
          set -euo pipefail
          echo "kernel: $(uname -r)"
          for knob in kernel.apparmor_restrict_unprivileged_userns \
                      kernel.unprivileged_userns_clone; do
            if sysctl -n "$knob" >/dev/null 2>&1; then
              echo "$knob = $(sysctl -n "$knob")"
            else
              echo "$knob: not present"
            fi
          done
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Smoke test - arg0 and sandbox
        shell: bash
        run: |
          set -uo pipefail
          export CODEX_HOME="${RUNNER_TEMP}/codex-home"
          mkdir -p "$CODEX_HOME"

          # Deliberately NOT `set -e` around this: the whole point of the step
          # is the command's output, and letting -e kill the shell first throws
          # away the only diagnostic there is.
          out="$("${PKG}/bin/${VARIANT}" sandbox -- /bin/echo rondo-sandbox-ok 2>&1)"
          status=$?
          echo "--- exit ${status} ---"
          echo "$out"

          if [[ $status -ne 0 ]] || ! grep -q 'rondo-sandbox-ok' <<<"$out"; then
            echo "--- diagnostics ---"
            echo "bundled bwrap:"
            "${PKG}/codex-resources/bwrap" --version || echo "  bundled bwrap failed to run"
            echo "direct bwrap userns probe:"
            "${PKG}/codex-resources/bwrap" --unshare-user --unshare-pid \
              --ro-bind / / /bin/echo bwrap-userns-ok || echo "  bwrap could not create a user namespace"
            echo "::error::sandbox smoke test failed"
            exit 1
          fi

      # A14: prove the bundled bwrap digest check is actually compiled in.
      #
      # Flipping a random byte is NOT acceptable evidence: it can simply corrupt
      # the ELF, so a refusal proves only "it would not run". Appending one byte
      # to the tail changes the SHA-256 while leaving the file executable (ELF
      # loaders ignore trailing bytes), and step 2 below confirms that directly.
      # Only the specific digest-mismatch error proves the check fired.
      - name: A14 - bundled bwrap tamper detection
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_HOME="${RUNNER_TEMP}/codex-home-tamper"
          mkdir -p "$CODEX_HOME"

          tampered="${RUNNER_TEMP}/tampered"
          rm -rf "$tampered"
          cp -a "$PKG" "$tampered"

          before="$(sha256sum "${tampered}/codex-resources/bwrap" | awk '{print $1}')"
          printf 'X' >> "${tampered}/codex-resources/bwrap"
          after="$(sha256sum "${tampered}/codex-resources/bwrap" | awk '{print $1}')"
          test "$before" != "$after" || { echo "::error::tampering did not change the digest"; exit 1; }
          echo "digest changed: ${before} -> ${after}"

          # Rule out the false positive: the tampered file must still execute.
          if ! "${tampered}/codex-resources/bwrap" --version >/dev/null 2>&1; then
            echo "::error::tampered bwrap no longer runs; a refusal below would prove nothing."
            exit 1
          fi
          echo "ok  tampered bwrap still executes standalone"

          set +e
          out="$("${tampered}/bin/${VARIANT}" sandbox -- /bin/true 2>&1)"
          status=$?
          set -e
          echo "$out"

          if [[ $status -eq 0 ]]; then
            echo "::error::product accepted a tampered bundled bwrap."
            exit 1
          fi
          echo "$out" | grep -q 'bundled bubblewrap digest mismatch' || {
            echo "::error::product failed, but not with the digest-mismatch error."
            echo "::error::That does not prove CODEX_BWRAP_SHA256 was compiled in."
            exit 1
          }
          echo "ok  bundled bwrap integrity check is active"

  # ---------------------------------------------------------------------------
  # Publish. This is the only job with write access.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [validate, build, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      PRODUCT_DIR: ${{ needs.validate.outputs.product_dir }}
      VARIANT: ${{ needs.validate.outputs.variant }}
      VERSION: ${{ needs.validate.outputs.version }}
      BASE_VERSION: ${{ needs.validate.outputs.base_version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rondo-package-x86_64-unknown-linux-musl
          path: dist


      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          bash .github/scripts/compose-release-notes.sh \
            --product-dir "$PRODUCT_DIR" \
            --variant "$VARIANT" \
            --version "$VERSION" \
            --base-version "$BASE_VERSION" \
            --tag "$TAG" \
            --prerelease "$PRERELEASE" \
            --out "$notes"
          echo "NOTES=$notes" >> "$GITHUB_ENV"
          echo "----- release notes -----"
          cat "$notes"

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          args=(
            "$TAG"
            --title "${VARIANT} ${VERSION}"
            --notes-file "$NOTES"
            --verify-tag
          )
          # Neither track claims the repository-level "latest" pointer. This
          # repo publishes two independent product lines (local-v*, multi-v*)
          # from one tag namespace, but GitHub has exactly one such pointer, so
          # whichever line published most recently would silently present itself
          # as the repo's current release and demote the other. The README links
          # to explicit tags instead.
          args+=(--latest=false)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}" dist/*

          # Confirm what was actually published rather than printing it.
          # (`gh release view --json` has no isLatest/assets fields, so this
          # goes through the REST API.)
          published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          jq '{tag: .tag_name, name, draft, prerelease, assets: [.assets[].name]}' <<<"$published"

          actual_prerelease="$(jq -r '.prerelease' <<<"$published")"
          if [[ "$actual_prerelease" != "$PRERELEASE" ]]; then
            echo "::error::prerelease is ${actual_prerelease}, expected ${PRERELEASE}"
            exit 1
          fi
          if [[ "$(jq -r '.draft' <<<"$published")" != "false" ]]; then
            echo "::error::release was published as a draft"
            exit 1
          fi
          if [[ "$(jq -r '.assets | length' <<<"$published")" -lt 2 ]]; then
            echo "::error::expected both the package archive and SHA256SUMS"
            exit 1
          fi

          # No release of either track may own the repository-level "latest"
          # pointer. A 404 from releases/latest is the healthy state and means
          # nothing claims it. gh prints the error body on stdout, so branch on
          # the exit status instead of letting it contaminate the value.
          latest_tag() {
            local json
            if json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null)"; then
              jq -r '.tag_name' <<<"$json"
            else
              echo "<none>"
            fi
          }

          # Enforce rather than merely observe: going red on an already-public
          # release helps nobody, so take the pointer back if GitHub handed it
          # over despite --latest=false.
          if [[ "$(latest_tag)" == "$TAG" ]]; then
            echo "${TAG} claimed the shared latest pointer; clearing it"
            gh api -X PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/$(jq -r '.id' <<<"$published")" \
              -f make_latest=false >/dev/null
          fi

          final_latest="$(latest_tag)"
          echo "repository-level latest is now: ${final_latest}"
          if [[ "$final_latest" == "$TAG" ]]; then
            echo "::error::${TAG} still owns the repository-level latest pointer, which both product lines share"
            exit 1
          fi
